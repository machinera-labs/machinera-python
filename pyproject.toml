[build-system]
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

[project]
name = "machinera"
dynamic = ["version"]
description = "Python client for the Machinera API"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
authors = [{ name = "Machinera" }]
keywords = ["transcription", "speech-to-text", "asr", "audio", "machinera"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
    "Typing :: Typed",
]
dependencies = ["httpcore>=1,<2", "httpx>=0.27,<1", "pydantic>=2,<3"]

[project.urls]
Homepage = "https://github.com/machinera-labs/machinera-python"
Documentation = "https://github.com/machinera-labs/machinera-python/blob/main/api.md"
Repository = "https://github.com/machinera-labs/machinera-python"
Changelog = "https://github.com/machinera-labs/machinera-python/blob/main/CHANGELOG.md"
Issues = "https://github.com/machinera-labs/machinera-python/issues"

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.24,<2", "ruff", "mypy", "build", "twine"]

[tool.hatch.version]
path = "src/machinera/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/machinera"]

[tool.hatch.build.targets.sdist]
include = [
    "/src/machinera",
    "/tests",
    "/examples",
    "/scripts",
    "/.github",
    "/.python-version",
    "/CHANGELOG.md",
    "/CONTRIBUTING.md",
    "/SECURITY.md",
    "/api.md",
    "/uv.lock",
    "/LICENSE",
    "/README.md",
    "/pyproject.toml",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.10"
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["error"]
xfail_strict = true
